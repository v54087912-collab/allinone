<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Resizer - Scale Images by Pixels, Percentages & Social Presets</title>
    <meta name="description" content="Resize photos and graphics by exact pixel dimensions, percentage scale, or popular social media templates (Instagram, YouTube, Twitter/X, 4K)." />
    <link rel="canonical" href="https://toolora0.pages.dev/image-resizer.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Image Resizer</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">High-performance in-browser image resizing with aspect ratio locks, quality control, and fit modes.</p>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6">
        <div id="resize-drop-zone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-10 text-center cursor-pointer hover:border-blue-500 transition-colors">
          <input type="file" id="resize-file-input" accept="image/*" class="hidden" />
          <div class="text-4xl mb-3">📐</div>
          <p class="font-semibold text-slate-800 dark:text-slate-200">Select or drop an image to resize</p>
          <p class="text-xs text-slate-500 mt-1">Supports PNG, JPG, WEBP, GIF, SVG</p>
        </div>

        <div id="resize-editor" class="hidden space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800">
            <span id="resize-info-badge" class="text-xs font-mono font-semibold text-slate-600 dark:text-slate-300">Original: 0 × 0 px</span>
            <div class="flex items-center gap-3">
              <div>
                <label class="text-2xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Preset Dimension</label>
                <select id="resize-preset-select" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="custom">Custom Dimensions</option>
                  <optgroup label="Percentage Scale">
                    <option value="scale-25">25% of Original</option>
                    <option value="scale-50">50% of Original</option>
                    <option value="scale-75">75% of Original</option>
                    <option value="scale-150">150% Upscale</option>
                    <option value="scale-200">200% (2x Retina)</option>
                  </optgroup>
                  <optgroup label="Social Media Formats">
                    <option value="1080x1080">Instagram Post (1080 × 1080)</option>
                    <option value="1080x1920">Instagram Story / Reel (1080 × 1920)</option>
                    <option value="1280x720">YouTube Thumbnail (1280 × 720)</option>
                    <option value="1200x675">Twitter / X Post (1200 × 675)</option>
                    <option value="1584x396">LinkedIn Banner (1584 × 396)</option>
                    <option value="820x312">Facebook Cover (820 × 312)</option>
                    <option value="1920x1080">Full HD (1920 × 1080)</option>
                    <option value="3840x2160">4K Ultra HD (3840 × 2160)</option>
                  </optgroup>
                </select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Width (px)</label>
              <input type="number" id="resize-width" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold" />
            </div>

            <div class="flex items-end justify-center">
              <button type="button" id="lock-aspect-btn" title="Toggle Aspect Ratio Lock" class="w-full py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-blue-600 bg-blue-50 dark:bg-blue-900/30 cursor-pointer transition-colors flex items-center justify-center gap-2">
                <span>🔗</span>
                <span>Aspect Ratio Locked</span>
              </button>
            </div>

            <div>
              <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Height (px)</label>
              <input type="number" id="resize-height" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Scaling Mode</label>
              <select id="resize-fit-select" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                <option value="fit" selected>Fit (Maintain proportions with padding)</option>
                <option value="cover">Cover (Center Crop to exact dimensions)</option>
                <option value="stretch">Stretch (Fit exact dimensions without crop)</option>
              </select>
            </div>

            <div>
              <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Background (for Fit mode)</label>
              <select id="resize-bg-select" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                <option value="transparent" selected>Transparent</option>
                <option value="#ffffff">White</option>
                <option value="#000000">Black</option>
              </select>
            </div>
          </div>

          <div class="flex justify-center bg-slate-900/5 dark:bg-slate-950/60 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
            <canvas id="resize-canvas" class="max-w-full rounded-xl shadow-md"></canvas>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-200 dark:border-slate-800">
            <div class="flex flex-wrap items-center gap-4">
              <div>
                <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Format</label>
                <select id="resize-format" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="image/png" selected>PNG (Lossless)</option>
                  <option value="image/jpeg">JPEG (Compressed)</option>
                  <option value="image/webp">WEBP (Web-Optimized)</option>
                </select>
              </div>
              <div class="w-36">
                <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                  <span>Quality</span>
                  <span id="resize-quality-val">90%</span>
                </div>
                <input type="range" id="resize-quality" min="10" max="100" value="90" class="w-full accent-blue-600" />
              </div>
            </div>

            <button type="button" id="download-resized-btn" class="py-2.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer shadow-xs transition-colors">
              Download Resized Image
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/image-resizer.ts"></script>
  </body>
</html>
