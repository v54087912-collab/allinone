<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Distance Calculator - Great Circle Distance & Flight Times</title>
    <meta name="description" content="Calculate straight-line distance, bearing, and flight time between cities or GPS coordinates via Haversine formula." />
    <link rel="canonical" href="https://toolora0.pages.dev/distance-calculator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Distance Calculator</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Compute great-circle distances, nautical miles, compass bearings, and flight durations.</p>
      </div>

      
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6 max-w-2xl mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase">Location 1 (Origin)</label>
                <select id="city1-preset" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="nyc" selected>New York, USA</option>
                  <option value="london">London, UK</option>
                  <option value="tokyo">Tokyo, Japan</option>
                  <option value="delhi">New Delhi, India</option>
                </select>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <input type="number" id="lat1" value="40.7128" step="0.0001" placeholder="Lat 1" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                  <input type="number" id="lon1" value="-74.0060" step="0.0001" placeholder="Lon 1" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                </div>
              </div>
              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-2">
                <label class="block text-xs font-semibold text-slate-500 uppercase">Location 2 (Destination)</label>
                <select id="city2-preset" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="london" selected>London, UK</option>
                  <option value="nyc">New York, USA</option>
                  <option value="tokyo">Tokyo, Japan</option>
                  <option value="paris">Paris, France</option>
                </select>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <input type="number" id="lat2" value="51.5074" step="0.0001" placeholder="Lat 2" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                  <input type="number" id="lon2" value="-0.1278" step="0.0001" placeholder="Lon 2" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                </div>
              </div>
            </div>
            <button type="button" id="calc-btn" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer">Calculate Distance</button>
            <div class="p-6 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 text-center space-y-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400">Calculated Distance</span>
              <h2 id="dist-km" class="text-3xl font-extrabold text-slate-900 dark:text-slate-100 font-mono">5,570 km</h2>
              <div class="flex justify-center gap-4 text-xs font-semibold text-slate-600 dark:text-slate-300">
                <span id="dist-miles">3,461 miles</span>
                <span>•</span>
                <span id="dist-nmi">3,007 nmi</span>
                <span>•</span>
                <span id="dist-bearing">52.2° (NE)</span>
              </div>
              <div class="text-xs text-slate-500 pt-1">Est. Flight Time: <strong id="dist-flight" class="text-slate-700 dark:text-slate-200">~7.5 hours</strong></div>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/distance-calculator.ts"></script>
  </body>
</html>
