<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marks Calculator - Total Marks, Percentage & Grade Online</title>
    <meta name="description" content="Calculate total marks, percentage, overall grade, and pass/fail status across all school and college subjects." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/marks-calculator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Marks Calculator</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Subject marks tally with total scores, percentage calculations, and passing checks.</p>
      </div>

      
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-200 dark:border-slate-800">
                      <th class="py-2 px-3 font-semibold">Subject</th>
                      <th class="py-2 px-3 font-semibold">Marks Obtained</th>
                      <th class="py-2 px-3 font-semibold">Max Marks</th>
                      <th class="py-2 px-3 font-semibold">Passing Marks</th>
                      <th class="py-2 px-3 text-right font-semibold">Action</th>
                    </tr>
                  </thead>
                  <tbody id="subject-rows"></tbody>
                </table>
              </div>
              <div class="flex justify-between items-center pt-2">
                <button type="button" id="add-subject-btn" class="py-2 px-4 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">+ Add Subject</button>
                <button type="button" id="calculate-btn" class="py-2.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer">Calculate Total & Percentage</button>
              </div>
            </div>
            <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs text-center space-y-4">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Marks Summary</span>
              <div>
                <h2 id="total-score" class="text-3xl font-extrabold text-slate-900 dark:text-slate-100 font-mono">343 / 400</h2>
                <span id="percentage-display" class="text-2xl font-bold text-blue-600 dark:text-blue-400 block mt-1">85.75%</span>
              </div>
              <div class="flex justify-center items-center gap-2">
                <span id="grade-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300">Grade: A</span>
                <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300">PASSED</span>
              </div>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/marks-calculator.ts"></script>
  </body>
</html>
