<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speech & Voice Recorder - Free Browser Audio Recording</title>
    <meta name="description" content="Record high quality microphone audio and voice memos with real-time visualizer and instant download." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/speech-recorder.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Speech Recorder</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Record clear voice audio directly in your browser with live frequency visualization.</p>
      </div>

      
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6 text-center">
            <div class="flex flex-col items-center justify-center space-y-2">
              <div class="text-5xl font-mono font-bold tracking-tight text-slate-800 dark:text-slate-100" id="timer-display">00:00</div>
              <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Recording Duration</div>
            </div>
            <canvas id="visualizer-canvas" width="600" height="120" class="w-full h-32 rounded-xl bg-slate-950 border border-slate-800"></canvas>
            <div class="flex justify-center items-center gap-3">
              <button type="button" id="record-btn" class="py-3 px-6 rounded-xl bg-red-600 hover:bg-red-700 text-white font-semibold text-sm cursor-pointer shadow-md flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-white animate-pulse"></span> Start Recording
              </button>
              <button type="button" id="pause-btn" disabled class="py-3 px-5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-sm disabled:opacity-40 cursor-pointer">Pause</button>
              <button type="button" id="stop-btn" disabled class="py-3 px-5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-semibold text-sm disabled:opacity-40 cursor-pointer">Stop</button>
            </div>
            <audio id="audio-preview" controls class="hidden w-full max-w-md mx-auto mt-4"></audio>
            <div id="download-container" class="hidden p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-center max-w-md mx-auto">
              <a id="download-link" class="inline-block py-2.5 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm cursor-pointer shadow-xs">Download Recording (.webm)</a>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/speech-recorder.ts"></script>
  </body>
</html>
