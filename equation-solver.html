<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equation Solver - Linear, Quadratic & System of Equations</title>
    <meta name="description" content="Step-by-step mathematical equation solver for linear equations, quadratic polynomials, and 2x2 systems." />
    <link rel="canonical" href="https://toolora0.pages.dev/equation-solver.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Equation Solver</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Solve algebraic equations with detailed step-by-step mathematical derivations.</p>
      </div>

      
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6 max-w-2xl mx-auto">
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-1">Equation Type</label>
              <select id="eq-type" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs">
                <option value="linear">Linear Equation (ax + b = c)</option>
                <option value="quadratic">Quadratic Equation (ax² + bx + c = 0)</option>
                <option value="system">System of 2 Linear Equations</option>
              </select>
            </div>
            <div id="linear-form" class="grid grid-cols-3 gap-3 text-xs">
              <div><label class="text-slate-400 block mb-1">a (Coefficient)</label><input type="number" id="lin-a" value="3" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
              <div><label class="text-slate-400 block mb-1">b (Constant)</label><input type="number" id="lin-b" value="5" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
              <div><label class="text-slate-400 block mb-1">c (Result)</label><input type="number" id="lin-c" value="20" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
            </div>
            <div id="quad-form" class="hidden grid grid-cols-3 gap-3 text-xs">
              <div><label class="text-slate-400 block mb-1">a (x²)</label><input type="number" id="quad-a" value="1" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
              <div><label class="text-slate-400 block mb-1">b (x)</label><input type="number" id="quad-b" value="-5" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
              <div><label class="text-slate-400 block mb-1">c (Constant)</label><input type="number" id="quad-c" value="6" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" /></div>
            </div>
            <div id="system-form" class="hidden space-y-2 text-xs">
              <div class="grid grid-cols-3 gap-2">
                <input type="number" id="sys-a1" value="2" placeholder="a1" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                <input type="number" id="sys-b1" value="3" placeholder="b1" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                <input type="number" id="sys-c1" value="8" placeholder="c1" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
              </div>
              <div class="grid grid-cols-3 gap-2">
                <input type="number" id="sys-a2" value="1" placeholder="a2" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                <input type="number" id="sys-b2" value="-1" placeholder="b2" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                <input type="number" id="sys-c2" value="-1" placeholder="c2" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
              </div>
            </div>
            <button type="button" id="solve-btn" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer">Solve Equation</button>
            <div id="solution-box" class="hidden p-6 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-3">
              <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Step-by-Step Solution</div>
              <ol id="steps-list" class="space-y-1.5 list-decimal pl-4"></ol>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/equation-solver.ts"></script>
  </body>
</html>
