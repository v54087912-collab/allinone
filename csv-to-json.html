    <!-- Instant Theme Resolution (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toolora_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8 text-center max-w-3xl mx-auto">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-900 mb-3">
          <span>Data Converter</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">CSV to JSON Converter</h1>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Transform tabular CSV data into clean, structured JSON with automatic type inference.</p>
      </div>

      
      <div class="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-3 mb-6">
        <div class="flex items-center gap-3 flex-wrap">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Delimiter</label>
            <select id="delimiter-select" class="px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white">
              <option value="auto">Auto-Detect</option>
              <option value=",">Comma (,)</option>
              <option value="	">Tab (TSV)</option>
              <option value=";">Semicolon (;)</option>
              <option value="|">Pipe (|)</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Output Structure</label>
            <select id="output-mode-select" class="px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white">
              <option value="objects">Array of Objects ([{...}])</option>
              <option value="arrays">2D Matrix of Arrays ([[...]])</option>
              <option value="columnar">Columnar Object ({"col": [...]})</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Indentation</label>
            <select id="indent-select" class="px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white">
              <option value="2" selected>2 Spaces</option>
              <option value="4">4 Spaces</option>
              <option value="0">Compact / Minified</option>
            </select>
          </div>
          <div class="flex items-center pt-5">
            <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700 dark:text-slate-300">
              <input type="checkbox" id="infer-types-checkbox" checked class="rounded text-blue-600 focus:ring-blue-500" />
              <span>Parse Numbers &amp; Booleans</span>
            </label>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button type="button" id="btn-sample" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer">Sample</button>
          <button type="button" id="btn-clear" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 cursor-pointer">Clear</button>
          <button type="button" id="btn-convert" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm cursor-pointer">Convert to JSON &rarr;</button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-500">CSV Input</label>
            <div id="drop-zone" class="text-xs text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">
              Upload .csv file
              <input type="file" id="file-input" accept=".csv,.tsv,.txt" class="hidden" />
            </div>
          </div>
          <textarea id="csv-input" rows="16" placeholder="Paste CSV data here..." class="w-full p-4 font-mono text-xs rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm"></textarea>
        </div>

        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-500">JSON Output</label>
            <div class="space-x-2">
              <button type="button" id="btn-copy" class="px-3 py-1 rounded-lg text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 cursor-pointer">Copy</button>
              <button type="button" id="btn-download" class="px-3 py-1 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer">Download .json</button>
            </div>
          </div>
          <textarea id="json-output" rows="16" readonly placeholder="Generated JSON will appear here..." class="w-full p-4 font-mono text-xs rounded-3xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/60 text-slate-900 dark:text-white shadow-sm"></textarea>
        </div>
      </div>

      <div id="stats-badge" class="hidden p-3 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800 text-xs font-mono text-blue-700 dark:text-blue-300"></div>
