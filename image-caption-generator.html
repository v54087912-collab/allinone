<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Caption Generator - Free Online Meme & Photo Caption Creator</title>
    <meta name="description" content="Generate memes, breaking news headers, cinema subtitles, and polaroid captions over your photos with custom fonts, colors, and 1-click clipboard copy." />
    <link rel="canonical" href="https://toolora0.pages.dev/image-caption-generator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Image Caption Generator</h1>
            <span class="px-2 py-0.5 rounded-full text-2xs font-bold uppercase tracking-wider bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">⭐️ Featured</span>
          </div>
          <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Design viral memes, polaroid prints, breaking news headlines, and cinema subtitles right in your browser.</p>
        </div>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6">
        <div id="caption-drop-zone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 transition-colors">
          <input type="file" id="caption-file-input" accept="image/*" class="hidden" />
          <div class="text-4xl mb-2">💬</div>
          <p class="font-semibold text-slate-800 dark:text-slate-200">Upload your own photo or pick a sample template below</p>
          <div class="flex flex-wrap justify-center gap-2 mt-4">
            <button type="button" data-template="sunset" class="py-1 px-3 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">Sunset Gradient</button>
            <button type="button" data-template="mountain" class="py-1 px-3 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">Nature Mountain</button>
            <button type="button" data-template="dark" class="py-1 px-3 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 cursor-pointer">Slate Minimal</button>
          </div>
        </div>

        <div id="caption-editor" class="space-y-6">
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 space-y-4">
              <div>
                <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Caption Style</label>
                <select id="caption-style" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="meme" selected>Classic Meme (White + Black Outline)</option>
                  <option value="news">Breaking News Banner (Bottom Bar)</option>
                  <option value="cinema">Cinema Subtitle (Letterbox + Yellow)</option>
                  <option value="polaroid">Polaroid White Border (Script font)</option>
                </select>
              </div>

              <div>
                <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Top Caption / Header</label>
                <input type="text" id="caption-top-text" placeholder="WHEN YOU DEPLOY TO PRODUCTION" value="WHEN YOU FIND A FREE TOOL" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold" />
              </div>

              <div>
                <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Bottom Caption / Punchline</label>
                <input type="text" id="caption-bottom-text" placeholder="AND IT ACTUALLY WORKS" value="AND IT DOESN'T REQUIRE SIGNUP" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Font Family</label>
                  <select id="caption-font" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                    <option value="Impact" selected>Impact (Classic)</option>
                    <option value="Arial Black">Arial Black</option>
                    <option value="Trebuchet MS">Trebuchet MS</option>
                    <option value="Courier New">Monospace</option>
                  </select>
                </div>
                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Text Color</label>
                  <input type="color" id="caption-text-color" value="#ffffff" class="w-full h-9 rounded-xl border border-slate-200 dark:border-slate-700 cursor-pointer" />
                </div>
              </div>

              <div class="space-y-3 pt-2">
                <div>
                  <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                    <span>Font Size</span>
                  </div>
                  <input type="range" id="caption-size" min="20" max="80" value="48" class="w-full accent-blue-600" />
                </div>

                <div>
                  <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                    <span>Outline Stroke Width</span>
                  </div>
                  <input type="range" id="caption-stroke" min="0" max="10" value="5" class="w-full accent-blue-600" />
                </div>

                <div class="flex items-center gap-2">
                  <input type="checkbox" id="caption-uppercase" checked class="rounded-md accent-blue-600 w-4 h-4" />
                  <label for="caption-uppercase" class="text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer">ALL CAPS Format</label>
                </div>

                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Watermark / Handle (Optional)</label>
                  <input type="text" id="caption-watermark" placeholder="@mybrand" class="w-full p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
                </div>
              </div>

              <div class="pt-2 flex flex-col gap-2">
                <button type="button" id="download-caption-btn" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer shadow-xs transition-colors">
                  Download Captioned Image
                </button>
                <button type="button" id="copy-caption-btn" class="w-full py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer transition-colors">
                  Copy Image to Clipboard
                </button>
              </div>
            </div>

            <div class="lg:col-span-2 flex items-center justify-center bg-slate-900/5 dark:bg-slate-950/60 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
              <canvas id="caption-canvas" class="max-w-full rounded-xl shadow-md"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/image-caption-generator.ts"></script>
  </body>
</html>
