<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunrise & Sunset Calculator - Solar Times, Noon & Twilights</title>
    <meta name="description" content="Calculate exact sunrise, sunset, solar noon, day length, dawn, and dusk times for any coordinates on Earth." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/sunrise-sunset-calculator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Sunrise & Sunset Calculator</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Compute astronomical sun transit times and civil twilight hours worldwide.</p>
      </div>

      
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6 max-w-2xl mx-auto">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Preset City</label>
                <select id="city-preset" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="london">London, UK</option>
                  <option value="newyork">New York, USA</option>
                  <option value="tokyo">Tokyo, Japan</option>
                  <option value="delhi">New Delhi, India</option>
                  <option value="paris">Paris, France</option>
                  <option value="sydney">Sydney, Australia</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Date</label>
                <input type="date" id="date-input" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Latitude</label>
                <input type="number" id="lat-input" step="0.0001" value="51.5074" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Longitude</label>
                <input type="number" id="lng-input" step="0.0001" value="-0.1278" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              </div>
            </div>
            <button type="button" id="calc-btn" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer">Calculate Solar Times</button>
            
            <div class="grid grid-cols-2 gap-4 text-center">
              <div class="p-6 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800">
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-700 dark:text-amber-400">Sunrise</span>
                <h3 id="time-sunrise" class="text-2xl sm:text-3xl font-bold font-mono text-amber-800 dark:text-amber-300 mt-1">--:--</h3>
                <span class="text-[10px] text-slate-400 mt-1 block">Dawn: <strong id="time-dawn">--:--</strong></span>
              </div>
              <div class="p-6 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800">
                <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-700 dark:text-indigo-400">Sunset</span>
                <h3 id="time-sunset" class="text-2xl sm:text-3xl font-bold font-mono text-indigo-800 dark:text-indigo-300 mt-1">--:--</h3>
                <span class="text-[10px] text-slate-400 mt-1 block">Dusk: <strong id="time-dusk">--:--</strong></span>
              </div>
            </div>

            <div class="p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 flex justify-around text-center text-xs">
              <div>Solar Noon: <strong id="time-noon" class="text-slate-800 dark:text-slate-100 font-mono">--:--</strong></div>
              <div>Day Length: <strong id="time-length" class="text-slate-800 dark:text-slate-100 font-mono">--:--</strong></div>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/sunrise-sunset-calculator.ts"></script>
  </body>
</html>
