<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Calculator - Calculate College & High School GPA Online</title>
    <meta name="description" content="Calculate cumulative and semester GPA on 4.0, 5.0, and 10.0 scales with target GPA forecasting." />
    <link rel="canonical" href="https://toolora0.pages.dev/gpa-calculator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">GPA Calculator</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Weighted course GPA calculator with credit hours and future target projections.</p>
      </div>

      
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
              <div class="flex justify-between items-center">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Grading Scale</label>
                <select id="gpa-scale" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="4.0">4.0 Standard Scale (A=4, B=3, C=2)</option>
                  <option value="5.0">5.0 Weighted Scale</option>
                  <option value="10.0">10.0 CGPA Scale</option>
                </select>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-200 dark:border-slate-800">
                      <th class="py-2 px-3 font-semibold">Course / Subject</th>
                      <th class="py-2 px-3 font-semibold">Credits</th>
                      <th class="py-2 px-3 font-semibold">Grade</th>
                      <th class="py-2 px-3 text-right font-semibold">Action</th>
                    </tr>
                  </thead>
                  <tbody id="course-rows"></tbody>
                </table>
              </div>
              <div class="flex justify-between items-center pt-2">
                <button type="button" id="add-course-btn" class="py-2 px-4 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-slate-800 cursor-pointer">+ Add Course</button>
                <button type="button" id="calculate-btn" class="py-2.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer">Calculate GPA</button>
              </div>
            </div>
            <div class="space-y-6">
              <div class="p-6 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/40 text-center space-y-2">
                <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400">Calculated GPA</span>
                <h2 id="gpa-result" class="text-5xl font-extrabold text-blue-600 dark:text-blue-400 font-mono">3.55</h2>
                <span id="total-credits-result" class="block text-xs font-medium text-slate-500">10 Credits</span>
              </div>
              <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-3">
                <div class="text-xs font-semibold uppercase tracking-wider text-slate-500">Target GPA Forecast</div>
                <div class="grid grid-cols-2 gap-2 text-xs">
                  <div>
                    <label class="text-slate-400 block mb-1">Current GPA</label>
                    <input type="number" id="cur-gpa" step="0.01" value="3.2" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Current Credits</label>
                    <input type="number" id="cur-credits" value="60" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Target GPA</label>
                    <input type="number" id="tar-gpa" step="0.01" value="3.5" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                  </div>
                  <div>
                    <label class="text-slate-400 block mb-1">Remaining Credits</label>
                    <input type="number" id="rem-credits" value="30" class="w-full p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" />
                  </div>
                </div>
                <button type="button" id="target-calc-btn" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold cursor-pointer">Forecast Target</button>
                <div id="target-result" class="hidden p-3 rounded-lg bg-slate-50 dark:bg-slate-800 text-xs"></div>
              </div>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/gpa-calculator.ts"></script>
  </body>
</html>
