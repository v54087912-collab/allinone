<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG to PNG Converter - High Resolution Vector Renderer</title>
    <meta name="description" content="Convert vector SVG graphics into crisp, high-resolution PNG images at 1x, 2x, 4x, or custom pixel dimensions with transparent backgrounds." />
    <link rel="canonical" href="https://toolora0.pages.dev/svg-to-png-converter.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">SVG to PNG Converter</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Rasterize vector SVGs into pixel-perfect high-DPI PNGs with transparent or colored backgrounds.</p>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6">
        <div id="svg-drop-zone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-2xl p-10 text-center cursor-pointer hover:border-blue-500 transition-colors">
          <input type="file" id="svg-file-input" accept=".svg,image/svg+xml" class="hidden" />
          <div class="text-4xl mb-3">📐</div>
          <p class="font-semibold text-slate-800 dark:text-slate-200">Select or drop an SVG file to convert to PNG</p>
          <p class="text-xs text-slate-500 mt-1">Super-sharp rasterization at up to 8x resolution</p>
        </div>

        <div id="svg-editor" class="hidden space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800">
            <div class="flex flex-wrap items-center gap-4">
              <div>
                <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Scale Multiplier</label>
                <select id="svg-scale-select" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="1">1x (Native Vector Size)</option>
                  <option value="2" selected>2x (High DPI / Retina)</option>
                  <option value="3">3x (Crisp Display)</option>
                  <option value="4">4x (Ultra HD)</option>
                  <option value="8">8x (Print High-Res)</option>
                </select>
              </div>

              <div>
                <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Background</label>
                <select id="svg-bg-select" class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                  <option value="transparent" selected>Transparent (PNG Alpha)</option>
                  <option value="#ffffff">Solid White</option>
                  <option value="#000000">Solid Black</option>
                </select>
              </div>

              <div class="flex items-center gap-2">
                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Custom W</label>
                  <input type="number" id="svg-custom-w" placeholder="Auto" class="w-20 p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold" />
                </div>
                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Custom H</label>
                  <input type="number" id="svg-custom-h" placeholder="Auto" class="w-20 p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold" />
                </div>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <span id="svg-png-dims" class="text-xs font-mono font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">0 × 0 px</span>
              <button type="button" id="download-svg-png-btn" class="py-2.5 px-5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs cursor-pointer shadow-xs transition-colors">
                Download PNG
              </button>
            </div>
          </div>

          <div class="flex justify-center bg-slate-900/5 dark:bg-slate-950/60 p-4 rounded-2xl border border-slate-200/50 dark:border-slate-800/50 overflow-hidden">
            <canvas id="svg-render-canvas" class="max-w-full rounded-xl shadow-md"></canvas>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/svg-to-png-converter.ts"></script>
  </body>
</html>
