<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Schedule Generator - Free Printable 7-Day Timetable Maker</title>
    <meta name="description" content="Build visual 7-day weekly schedules, class timetables, and workout splits with color categories, hourly time blocks, and printable export." />
    <link rel="canonical" href="https://toolora0.pages.dev/weekly-schedule-generator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md print:hidden">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All 130 Tools
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
      <!-- Title & Controls -->
      <div class="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 mb-2">
            <span>📅 7-Day Timetable &amp; Schedule Creator</span>
          </div>
          <h1 class="text-3xl font-extrabold tracking-tight">Weekly Schedule Generator</h1>
        </div>

        <div class="flex flex-wrap items-center gap-2 print:hidden">
          <select id="schedule-template-select" class="px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none">
            <option value="pro">💼 9-to-5 Professional</option>
            <option value="student">🎓 College Student</option>
            <option value="fitness">🏋️ Workout &amp; Fitness Split</option>
          </select>
          <button type="button" id="schedule-load-template-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-xl transition-colors">
            Load Template
          </button>
          <button type="button" id="schedule-print-btn" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl shadow-xs transition-colors flex items-center gap-1.5">
            🖨️ Print
          </button>
          <button type="button" id="schedule-clear-btn" class="p-2 border border-slate-200 dark:border-slate-800 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-xl transition-colors text-xs" title="Clear schedule">
            ✕
          </button>
        </div>
      </div>

      <!-- Time Allocation Stats Bar -->
      <div class="grid grid-cols-3 gap-4 mb-6 text-center text-xs">
        <div class="p-3 bg-blue-50 dark:bg-blue-950/40 rounded-2xl border border-blue-200 dark:border-blue-900/60">
          <span class="text-blue-600 dark:text-blue-400 font-medium">Work &amp; Meetings</span>
          <div id="stat-work-hours" class="text-lg font-black text-blue-900 dark:text-blue-100 mt-0.5">0 hrs</div>
        </div>
        <div class="p-3 bg-emerald-50 dark:bg-emerald-950/40 rounded-2xl border border-emerald-200 dark:border-emerald-900/60">
          <span class="text-emerald-600 dark:text-emerald-400 font-medium">Fitness &amp; Health</span>
          <div id="stat-fitness-hours" class="text-lg font-black text-emerald-900 dark:text-emerald-100 mt-0.5">0 hrs</div>
        </div>
        <div class="p-3 bg-purple-50 dark:bg-purple-950/40 rounded-2xl border border-purple-200 dark:border-purple-900/60">
          <span class="text-purple-600 dark:text-purple-400 font-medium">Personal &amp; Study</span>
          <div id="stat-personal-hours" class="text-lg font-black text-purple-900 dark:text-purple-100 mt-0.5">0 hrs</div>
        </div>
      </div>

      <!-- Schedule Table / Grid Container -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-6 shadow-xs overflow-x-auto">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-8 gap-1.5 text-center font-bold text-xs uppercase tracking-wider mb-2 min-w-[700px]">
          <div class="p-2 text-slate-400">Time</div>
          <div class="p-2 text-slate-700 dark:text-slate-300">Mon</div>
          <div class="p-2 text-slate-700 dark:text-slate-300">Tue</div>
          <div class="p-2 text-slate-700 dark:text-slate-300">Wed</div>
          <div class="p-2 text-slate-700 dark:text-slate-300">Thu</div>
          <div class="p-2 text-slate-700 dark:text-slate-300">Fri</div>
          <div class="p-2 text-emerald-600 dark:text-emerald-400">Sat</div>
          <div class="p-2 text-emerald-600 dark:text-emerald-400">Sun</div>
        </div>

        <!-- 8 Columns x 12 Rows Grid -->
        <div id="weekly-schedule-grid" class="grid grid-cols-8 gap-1.5 min-w-[700px]">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </main>

    <!-- Slot Edit Modal -->
    <div id="schedule-edit-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
        <div>
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Edit Schedule Slot</span>
          <h3 id="modal-slot-title" class="text-base font-bold text-slate-900 dark:text-white mt-0.5">Slot</h3>
        </div>

        <div>
          <label for="modal-title-input" class="block text-xs font-semibold text-slate-500 mb-1">Activity Title</label>
          <input
            type="text"
            id="modal-title-input"
            placeholder="e.g. Deep Work, Gym, Calculus..."
            class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          />
        </div>

        <div>
          <label for="modal-category-select" class="block text-xs font-semibold text-slate-500 mb-1">Category</label>
          <select
            id="modal-category-select"
            class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none"
          >
            <option value="work">💼 Work (Blue)</option>
            <option value="meeting">🤝 Meeting (Amber)</option>
            <option value="fitness">🏋️ Fitness (Green)</option>
            <option value="study">📖 Study (Indigo)</option>
            <option value="personal">🏡 Personal (Purple)</option>
          </select>
        </div>

        <div class="flex items-center justify-between gap-2 pt-2">
          <button type="button" id="modal-delete-btn" class="px-3 py-2 text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-xl transition-colors cursor-pointer">
            Clear
          </button>
          <div class="flex items-center gap-2">
            <button type="button" id="modal-cancel-btn" class="px-3 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors cursor-pointer">
              Cancel
            </button>
            <button type="button" id="modal-save-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-xl shadow-xs transition-colors cursor-pointer">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 print:hidden">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/weekly-schedule-generator.ts"></script>
  </body>
</html>
