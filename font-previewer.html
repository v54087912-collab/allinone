<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Previewer - Test Custom Text Across Fonts Online</title>
    <meta name="description" content="Preview your own text and headings across standard system fonts, web fonts, and dynamic sizes." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/font-previewer.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Font Previewer</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Type custom sample copy and compare fonts and sizes side-by-side.</p>
      </div>

      
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-xs font-semibold text-slate-500 mb-1">Custom Sample Text</label>
                <input type="text" id="custom-text" value="The quick brown fox jumps over the lazy dog 1234567890" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs" />
              </div>
              <div>
                <label class="flex justify-between text-xs font-semibold text-slate-500 mb-1"><span>Font Size</span><span id="size-value">24px</span></label>
                <input type="range" id="font-size" min="12" max="64" value="24" class="w-full accent-blue-600" />
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div data-font class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                <div class="text-[11px] font-bold text-slate-400 mb-2">Inter / Sans-Serif</div>
                <p style="font-family: system-ui, -apple-system, sans-serif;" class="text-slate-800 dark:text-slate-200"></p>
              </div>
              <div data-font class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                <div class="text-[11px] font-bold text-slate-400 mb-2">Georgia / Serif</div>
                <p style="font-family: Georgia, serif;" class="text-slate-800 dark:text-slate-200"></p>
              </div>
              <div data-font class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                <div class="text-[11px] font-bold text-slate-400 mb-2">Courier / Monospace</div>
                <p style="font-family: 'Courier New', monospace;" class="text-slate-800 dark:text-slate-200"></p>
              </div>
              <div data-font class="p-5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                <div class="text-[11px] font-bold text-slate-400 mb-2">Impact / Display</div>
                <p style="font-family: Impact, sans-serif;" class="text-slate-800 dark:text-slate-200"></p>
              </div>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/font-previewer.ts"></script>
  </body>
</html>
