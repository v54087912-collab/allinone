    <!-- Instant Theme Resolution (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('toolora_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved ? saved === 'dark' : prefersDark;
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <header class="sticky top-0 z-40 w-full border-b border-slate-200/80 bg-white/80 dark:border-slate-800 dark:bg-slate-900/80 backdrop-blur-md">

              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>

          </button>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8 text-center max-w-3xl mx-auto">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-900 mb-3">
          <span>Text Tools</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">Text File Splitter</h1>
        <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Split large text files, logs, or CSV data into smaller chunks with CSV header preservation.</p>
      </div>

      
      <div class="p-5 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-4 mb-6">
        <div class="flex items-center gap-4 flex-wrap">
          <div>
            <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Splitting Mode</label>
            <select id="split-mode" class="px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-medium">
              <option value="lines" selected>By Line Count</option>
              <option value="parts">Into N Equal Parts</option>
              <option value="size">By Maximum File Size</option>
              <option value="delimiter">By Delimiter String</option>
            </select>
          </div>

          <div id="mode-lines-container">
            <label class="block text-[11px] font-bold text-slate-500 mb-1">Lines Per File</label>
            <input type="number" id="line-count-input" value="500" min="1" class="w-28 px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white" />
          </div>

          <div id="mode-parts-container" class="hidden">
            <label class="block text-[11px] font-bold text-slate-500 mb-1">Number of Parts</label>
            <input type="number" id="part-count-input" value="4" min="2" max="100" class="w-28 px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white" />
          </div>

          <div id="mode-size-container" class="hidden">
            <label class="block text-[11px] font-bold text-slate-500 mb-1">Chunk Size (KB)</label>
            <input type="number" id="size-input" value="100" min="1" class="w-28 px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white" />
          </div>

          <div id="mode-delim-container" class="hidden">
            <label class="block text-[11px] font-bold text-slate-500 mb-1">Delimiter String</label>
            <input type="text" id="delim-input" value="---" class="w-36 px-3 py-1.5 text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white font-mono" />
          </div>

          <div class="flex items-center pt-5">
            <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700 dark:text-slate-300">
              <input type="checkbox" id="preserve-csv-header" class="rounded text-blue-600 focus:ring-blue-500" />
              <span>Copy Row 1 (CSV Header) to every part</span>
            </label>
          </div>
        </div>

        <div class="flex items-center gap-3 pt-2">
          <button type="button" id="btn-clear" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 cursor-pointer">Clear</button>
          <button type="button" id="btn-split" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm cursor-pointer">Split File &rarr;</button>
        </div>
      </div>

      <div class="space-y-4 mb-6">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-500">Text Content to Split</label>
          <div id="drop-zone" class="text-xs text-blue-600 dark:text-blue-400 hover:underline cursor-pointer">
            Drop or upload text file
            <input type="file" id="file-input" class="hidden" />
          </div>
        </div>
        <textarea id="text-input" rows="10" placeholder="Paste large text content here or drop a file above..." class="w-full p-4 font-mono text-xs rounded-3xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-sm"></textarea>
      </div>

      <div id="results-container" class="hidden space-y-4">
        <div class="p-4 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-3">
          <span id="stats-badge" class="text-xs font-semibold text-slate-600 dark:text-slate-300"></span>
          <button type="button" id="btn-download-zip" class="px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs shadow-sm cursor-pointer">Download All Parts (ZIP)</button>
        </div>

        <div id="parts-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    
    </main>
