<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routine Planner - Free Daily Habit & Morning Routine Creator</title>
    <meta name="description" content="Design structured morning, afternoon, and evening routines with duration counters, step checklists, and persistent browser storage." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/routine-planner.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All 130 Tools
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <!-- Title & Intro -->
      <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-orange-50 text-orange-700 dark:bg-orange-950/60 dark:text-orange-300 border border-orange-200 dark:border-orange-800 mb-2">
            <span>⚡ Morning &amp; Night Routines</span>
          </div>
          <h1 class="text-3xl font-extrabold tracking-tight">Routine Planner</h1>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Design consistent rituals for peak productivity and calm evenings.
          </p>
        </div>
        <button
          type="button"
          id="routine-reset-checks-btn"
          class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-semibold rounded-xl transition-colors self-start sm:self-auto cursor-pointer"
        >
          🔄 Reset Today's Checkmarks
        </button>
      </div>

      <!-- Routine Blocks (3 columns) -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <!-- Morning Routine -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-xs flex flex-col">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
            <h2 class="text-sm font-bold text-amber-600 dark:text-amber-400 flex items-center gap-2">
              ☀️ Morning Routine
            </h2>
            <span id="morning-total-time" class="text-xs font-semibold text-slate-400">0 mins</span>
          </div>
          <div id="morning-routine-list" class="space-y-2 flex-1">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Afternoon Routine -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-xs flex flex-col">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
            <h2 class="text-sm font-bold text-blue-600 dark:text-blue-400 flex items-center gap-2">
              🌤️ Afternoon Routine
            </h2>
            <span id="afternoon-total-time" class="text-xs font-semibold text-slate-400">0 mins</span>
          </div>
          <div id="afternoon-routine-list" class="space-y-2 flex-1">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Evening Routine -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-xs flex flex-col">
          <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 mb-4">
            <h2 class="text-sm font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-2">
              🌙 Evening Routine
            </h2>
            <span id="evening-total-time" class="text-xs font-semibold text-slate-400">0 mins</span>
          </div>
          <div id="evening-routine-list" class="space-y-2 flex-1">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </div>

      <!-- Add New Step Form -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-xs">
        <h3 class="text-sm font-bold text-slate-800 dark:text-slate-200 mb-3">+ Add Step to Routine</h3>
        <form id="routine-add-form" class="grid grid-cols-1 sm:grid-cols-12 gap-3 text-xs">
          <div class="sm:col-span-3">
            <select id="routine-section-select" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none">
              <option value="morning">☀️ Morning Routine</option>
              <option value="afternoon">🌤️ Afternoon Routine</option>
              <option value="evening">🌙 Evening Routine</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <select id="routine-icon-select" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none">
              <option value="💧">💧 Water</option>
              <option value="🧘">🧘 Stretch/Meditate</option>
              <option value="☕">☕ Coffee/Tea</option>
              <option value="🏃">🏃 Exercise</option>
              <option value="📖">📖 Reading</option>
              <option value="🎯">🎯 Plan Day</option>
              <option value="🚿">🚿 Shower</option>
              <option value="📵">📵 Digital Detox</option>
              <option value="⚡">⚡ General</option>
            </select>
          </div>
          <div class="sm:col-span-4">
            <input
              type="text"
              id="routine-name-input"
              placeholder="Step description (e.g. 10m Journaling)..."
              required
              class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-orange-500"
            />
          </div>
          <div class="sm:col-span-1">
            <input
              type="number"
              id="routine-duration-input"
              min="1"
              max="180"
              value="10"
              title="Duration in minutes"
              class="w-full px-2 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-center focus:outline-none"
            />
          </div>
          <div class="sm:col-span-2">
            <button
              type="submit"
              class="w-full py-2 bg-orange-600 hover:bg-orange-700 text-white font-semibold rounded-xl shadow-xs transition-colors"
            >
              Add Step
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/routine-planner.ts"></script>
  </body>
</html>
