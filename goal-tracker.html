<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goal Tracker - Free Milestone & Progress Objective Tracker</title>
    <meta name="description" content="Track long-term goals with target metrics, milestone checklists, deadline countdowns, and completion percentages. 100% private in-browser storage." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/goal-tracker.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All 130 Tools
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
      <!-- Title & Intro -->
      <div class="mb-8">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-purple-50 text-purple-700 dark:bg-purple-950/60 dark:text-purple-300 border border-purple-200 dark:border-purple-800 mb-3">
          <span>🎯 Vision &amp; Milestone Planner</span>
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Goal Tracker</h1>
        <p class="mt-2 text-sm sm:text-base text-slate-600 dark:text-slate-400 max-w-xl">
          Set ambitious targets, break them into actionable milestones, and track your progress to completion.
        </p>
      </div>

      <!-- Stats Overview Banner -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-xs text-center">
          <span class="text-xs text-slate-400">Active Goals</span>
          <div id="goals-active-count" class="text-3xl font-extrabold text-purple-600 mt-1">0</div>
        </div>
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-xs text-center">
          <span class="text-xs text-slate-400">Goals Achieved</span>
          <div id="goals-completed-count" class="text-3xl font-extrabold text-emerald-600 mt-1">0</div>
        </div>
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-xs text-center">
          <span class="text-xs text-slate-400">Overall Progress</span>
          <div id="goals-overall-progress" class="text-3xl font-extrabold text-blue-600 mt-1">0%</div>
        </div>
      </div>

      <!-- Add New Goal Form -->
      <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 mb-8 shadow-xs">
        <h2 class="text-sm font-bold text-slate-900 dark:text-white mb-4">+ Set New Objective</h2>
        <form id="goal-add-form" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 text-xs">
            <div class="sm:col-span-5">
              <label for="goal-title-input" class="block font-medium text-slate-500 mb-1">Goal Title</label>
              <input
                type="text"
                id="goal-title-input"
                placeholder="e.g. Save $10,000, Run Half Marathon..."
                required
                class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-1 focus:ring-purple-500"
              />
            </div>
            <div class="sm:col-span-3">
              <label for="goal-category-select" class="block font-medium text-slate-500 mb-1">Category</label>
              <select
                id="goal-category-select"
                class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none"
              >
                <option value="Finance">💰 Finance</option>
                <option value="Fitness">🏃 Fitness</option>
                <option value="Learning">📖 Learning</option>
                <option value="Career">💼 Career</option>
                <option value="Personal">🏡 Personal</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label for="goal-target-val" class="block font-medium text-slate-500 mb-1">Target Value</label>
              <input
                type="number"
                id="goal-target-val"
                placeholder="100"
                required
                class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none text-center"
              />
            </div>
            <div class="sm:col-span-2">
              <label for="goal-unit-input" class="block font-medium text-slate-500 mb-1">Unit</label>
              <input
                type="text"
                id="goal-unit-input"
                placeholder="$, km, books, %"
                value="%"
                class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none text-center"
              />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label for="goal-deadline-input" class="block font-medium text-slate-500 mb-1">Target Deadline</label>
              <input
                type="date"
                id="goal-deadline-input"
                class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none"
              />
            </div>
            <div class="flex items-end">
              <button
                type="submit"
                class="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl shadow-xs transition-colors"
              >
                Create Goal
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- Filters -->
      <div class="flex items-center gap-2 mb-6 text-xs">
        <button type="button" data-filter="all" class="goal-filter-btn px-3 py-1.5 rounded-lg font-semibold bg-purple-600 text-white transition-all">All</button>
        <button type="button" data-filter="active" class="goal-filter-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all">In Progress</button>
        <button type="button" data-filter="completed" class="goal-filter-btn px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-slate-900 transition-all">Completed</button>
      </div>

      <!-- Goals List -->
      <div id="goals-container" class="space-y-4 mb-8">
        <!-- Rendered dynamically -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/goal-tracker.ts"></script>
  </body>
</html>
