<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Pattern Generator - Seamless Vector Background Patterns</title>
    <meta name="description" content="Generate seamless repeating vector SVG background patterns (Dots, Grid, Isometric, Stripes, Waves, Chevrons) with CSS code export." />
    <link rel="canonical" href="https://toolora0.pages.dev/svg-pattern-generator.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">SVG Pattern Generator</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Design clean geometric background patterns with customizable spacing, strokes, and instant CSS export.</p>
      </div>

      <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-1 space-y-4">
            <div>
              <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Pattern Style</label>
              <select id="pattern-type" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                <option value="dots" selected>Polka Dots</option>
                <option value="grid">Square Grid / Graph Paper</option>
                <option value="isometric">Isometric Diamond Grid</option>
                <option value="diagonal">Diagonal Stripes (45°)</option>
                <option value="crosses">Plus & Cross Marks</option>
                <option value="chevron">Chevron / Herringbone</option>
                <option value="waves">Sine Waveform</option>
                <option value="circles">Concentric Rings</option>
              </select>
            </div>

            <div class="space-y-3 pt-2">
              <div>
                <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                  <span>Tile Size (px)</span>
                </div>
                <input type="range" id="pattern-tile-size" min="16" max="120" value="36" class="w-full accent-blue-600" />
              </div>

              <div>
                <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                  <span>Element Scale</span>
                </div>
                <input type="range" id="pattern-elem-size" min="2" max="40" value="6" class="w-full accent-blue-600" />
              </div>

              <div>
                <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                  <span>Stroke Thickness</span>
                </div>
                <input type="range" id="pattern-stroke" min="1" max="8" value="2" class="w-full accent-blue-600" />
              </div>

              <div>
                <div class="flex justify-between text-2xs font-semibold text-slate-400 mb-1">
                  <span>Pattern Opacity</span>
                </div>
                <input type="range" id="pattern-opacity" min="10" max="100" value="100" class="w-full accent-blue-600" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Foreground</label>
                  <input type="color" id="pattern-fg-color" value="#3b82f6" class="w-full h-9 rounded-xl border border-slate-200 dark:border-slate-700 cursor-pointer" />
                </div>
                <div>
                  <label class="block text-2xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Background</label>
                  <input type="color" id="pattern-bg-color" value="#ffffff" class="w-full h-9 rounded-xl border border-slate-200 dark:border-slate-700 cursor-pointer" />
                </div>
              </div>

              <div>
                <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300 cursor-pointer">
                  <input type="checkbox" id="pattern-bg-trans" class="rounded-md accent-blue-600 w-4 h-4" />
                  <span>Transparent Background</span>
                </label>
              </div>
            </div>

            <div class="pt-2 flex flex-col gap-2">
              <button type="button" id="copy-pattern-svg-btn" class="w-full py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold text-xs text-slate-800 dark:text-slate-200 cursor-pointer transition-colors">
                Copy SVG Code
              </button>
              <button type="button" id="copy-pattern-css-btn" class="w-full py-2 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-semibold text-xs text-slate-800 dark:text-slate-200 cursor-pointer transition-colors">
                Copy CSS Background
              </button>
              <button type="button" id="download-pattern-svg-btn" class="w-full py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 font-semibold text-xs text-white cursor-pointer transition-colors">
                Download .SVG Tile
              </button>
            </div>
          </div>

          <div class="lg:col-span-2 min-h-96 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-inner overflow-hidden relative">
            <div id="pattern-preview-box" class="w-full h-full min-h-96 transition-all"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/svg-pattern-generator.ts"></script>
  </body>
</html>
