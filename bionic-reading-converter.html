<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bionic Reading Converter - Speed Read Faster with Artificial Fixation</title>
    <meta name="description" content="Convert articles, essays, and reading materials into Bionic Reading format to guide eye movements and read faster." />
    <link rel="canonical" href="https://quickpic-studio.pages.dev/bionic-reading-converter.html" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="/index.html" class="flex items-center gap-2.5 group" title="Toolora Home" aria-label="Toolora Home">
          <img src="/logo-light.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-light dark:hidden" />
          <img src="/logo-dark.jpg" alt="Toolora" class="h-9 w-auto rounded-xl object-contain shadow-xs group-hover:scale-105 transition-transform logo-dark hidden dark:block" />
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">Toolora</span>
        </a>
        <div class="flex items-center gap-3">
          <button data-theme-toggle type="button" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
            <svg data-theme-icon-sun class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg data-theme-icon-moon class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </button>
          <a href="/" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-100 transition-colors">
            All Tools
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-4xl mx-auto px-4 py-8 sm:px-6 w-full space-y-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Bionic Reading Converter</h1>
        <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Enhance reading speed and comprehension with artificial saccade fixation points.</p>
      </div>

      
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Input Text</label>
                <textarea id="bionic-input" rows="10" placeholder="Paste text here to convert into Bionic Reading mode..." class="w-full p-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs leading-relaxed">Bionic Reading is a reading system that guides the eyes through text with artificial fixation points. As a result, the reader focuses on the highlighted initial letters and lets the brain organ complete the words.

This creates a smooth, accelerated reading rhythm, allowing faster cognitive processing and improved focus especially for long articles, academic papers, and ADHD/dyslexia readers.</textarea>
              </div>

              <div>
                <label class="flex justify-between text-xs font-semibold text-slate-500 mb-1"><span>Fixation Strength</span><span id="fixation-value" class="text-blue-600 font-bold">50%</span></label>
                <input type="range" id="fixation-slider" min="20" max="80" step="10" value="50" class="w-full accent-blue-600" />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Reader Font</label>
                  <select id="font-family" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs">
                    <option value="system-ui, sans-serif">Modern Sans-Serif</option>
                    <option value="Georgia, serif">Editorial Serif</option>
                    <option value="'Courier New', monospace">Clean Monospace</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">Theme</label>
                  <select id="reader-theme" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs">
                    <option value="default">Clean Standard</option>
                    <option value="sepia">Warm Sepia</option>
                    <option value="dark">OLED Dark</option>
                  </select>
                </div>
              </div>

              <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="copy-text-btn" class="py-2 px-4 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold cursor-pointer">Copy Raw</button>
                <button type="button" id="copy-html-btn" class="py-2 px-5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold cursor-pointer shadow-xs">Copy HTML</button>
              </div>
            </div>

            <div class="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs flex flex-col justify-between">
              <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Bionic Reading Preview</div>
              <div id="bionic-output" class="flex-1 p-6 rounded-xl border border-slate-100 dark:border-slate-800 overflow-y-auto leading-relaxed max-h-[460px]"></div>
            </div>
          </div>
        
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
      100% In-Browser Offline Utility &bull; Zero Server Tracking
    </footer>

    <script type="module" src="/src/shared/site-shell.ts"></script>
    <script type="module" src="/src/tools/bionic-reading-converter.ts"></script>
  </body>
</html>
